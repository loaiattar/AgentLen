name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The pipeline must never need a real provider key. Any job that touches the
  # AI port runs against the test double. See ADR-006.
  AI_PROVIDER: fake
  PYTHON_VERSION: '3.12'

jobs:
  # ── Backend · style, types and the dependency rule ──────────────────────────
  backend-lint:
    name: Backend · lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint (S rules forbid eval/exec)
        run: ruff check .

      - name: Type check — strict on the whole package
        # Everything, `interfaces/` included. The narrower scope this replaces
        # covered domain, application and infrastructure/ai only, and three real
        # errors sat in `interfaces/` for as long as it did: `SqlAlchemyUnitOfWork`
        # had stopped satisfying the `UnitOfWork` port, and the conversion is
        # only ever performed in `interfaces/`, so nothing checked it.
        #
        # infrastructure/ai stays in scope for its own reason: the
        # SanitizedSamples NewType is only binding if handing raw records to
        # the prompt builder fails here rather than in review.
        run: mypy --strict src/agentlen

      - name: Dependency rule (import-linter)
        # The automated proof of the Clean Architecture. A PR that imports
        # sqlalchemy from domain/ dies here, not in review.
        run: lint-imports

  # ── Backend · unit tests, no infrastructure ────────────────────────────────
  backend-unit:
    name: Backend · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: pytest tests/unit tests/contract
        # Deliberately without a database service: if a domain or application
        # rule needs Postgres to be tested, that is an architecture defect.
        #
        # `tests/contract` runs here for its in-memory half — the doubles the
        # unit tests rely on. Its SQL half skips without a database and is run
        # by the job below, where both halves are compared for real.
        run: pytest tests/unit tests/contract -q

  # ── Backend · integration, e2e and migrations against a real Postgres ──────
  backend-db:
    name: Backend · integration & e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentlen
          POSTGRES_PASSWORD: agentlen
          POSTGRES_DB: agentlen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentlen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://agentlen:agentlen@localhost:5432/agentlen
      TEST_DATABASE_URL: postgresql+asyncpg://agentlen:agentlen@localhost:5432/agentlen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Migration round trip
        # A migration that cannot be undone is a migration nobody dares to fix.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: pytest tests/integration tests/e2e tests/contract
        # A skipped test still exits 0. The database fixtures skip when they
        # decide Postgres is out of reach, so without this check the job could
        # report success having exercised no database at all — the same class
        # of silent pass this workflow replaces. Today the Alembic step above
        # would fail first, but that guard is accidental: it depends on step
        # order, and would vanish the day someone reorders them.
        #
        # `tests/contract` is in scope here, and this is the job that makes it
        # mean something: it is the only place both halves run, so a double
        # that has drifted from the SQL repository fails rather than agreeing
        # with itself. It was in no job at all before.
        run: |
          set -o pipefail
          pytest tests/integration tests/e2e tests/contract -q | tee pytest-db.out
          if grep -qE '[0-9]+ skipped' pytest-db.out; then
            echo "::error::Database tests were skipped — the Postgres service was not reached."
            exit 1
          fi

  # ── Guards · secrets and hardcoded model identifiers ───────────────────────
  guards:
    name: Guards · secrets & model ids
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secret scan
        # --no-git scans the tree as it stands, so a pre-existing finding in
        # old history cannot make every future PR red.
        run: gitleaks detect --no-git --no-banner --redact --exit-code 1 --source .

      - name: No hardcoded model identifiers
        # ADR-006: provider and model come from configuration. An id written
        # into src/ silently defeats the interchangeability requirement.
        # Matches model families only — "claude-code" is an agent name and is
        # legitimate in the data model.
        run: |
          PATTERN='claude-(opus|sonnet|haiku)|claude-[0-9]|gpt-[0-9]|text-davinci'
          if grep -rnE "$PATTERN" src/; then
            echo "::error::Hardcoded model identifier in src/. Model ids come from configuration (ADR-006)."
            exit 1
          fi
          echo "No hardcoded model identifier."

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 declares `^22.22.2 || ^24.15.0 || >=26.0.0`, and on Node 20
          # its undici calls `webidl.util.markAsUncloneable`, which does not
          # exist there — every worker fails to start and the suite reports
          # "no tests". Kept in step with `engines` in frontend/package.json.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        # No `--if-present`. The flag makes a missing script a silent pass, and
        # that is exactly what this step did until the suite existed: green,
        # every run, testing nothing. Now that `test` is defined, removing it
        # has to break the build rather than quietly stop checking.
        run: npm test

  # ── Aggregate — this is the check to require in branch protection ──────────
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit, backend-db, guards, frontend]
    if: always()
    steps:
      - name: Verify every job succeeded
        # Always runs, so it can always report a status. That is what makes it
        # safe to mark as a required check: a job that is skipped or cancelled
        # never leaves a PR waiting forever on a status that never arrives.
        #
        # Demand `success` rather than enumerating failure modes. Listing
        # 'failure' and 'cancelled' would let `skipped` through — which is
        # precisely the "every job skips, the pipeline is green" bug this
        # workflow exists to kill. It also stays correct when someone adds a
        # sixth job or puts an `if:` on an existing one.
        run: |
          failed=0
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required job reported '$result'."
              failed=1
            fi
          done
          [[ "$failed" -eq 0 ]] || exit 1
          echo "All CI checks passed."
