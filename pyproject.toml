[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "import-linter>=2.0",
    "ruff>=0.4",
    # Integration tests run against a real, throwaway Postgres 16.
    "testcontainers[postgres]>=4.0",
    "psycopg[binary]>=3.1",
    # ASGI transport for in-process HTTP tests — no server, no ports.
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real Postgres (skipped when Docker is unavailable)",
]

# ---------------------------------------------------------------------------
# Mypy — strict on domain and application only
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/", "alembic/"]

[[tool.mypy.overrides]]
module = "agentlen.infrastructure.files.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# import-linter — enforces the dependency rule mechanically
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "agentlen"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain has no third-party imports"
type = "forbidden"
source_modules = ["agentlen.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "polars",
    "anthropic",
    "openai",
    "pydantic",
    "httpx",
    "aiohttp",
]

[[tool.importlinter.contracts]]
name = "Layers point inwards only"
type = "layers"
layers = [
    "agentlen.interfaces",
    "agentlen.infrastructure",
    "agentlen.application",
    "agentlen.domain",
]

[[tool.importlinter.contracts]]
name = "Application does not import infrastructure"
type = "forbidden"
source_modules = ["agentlen.application"]
forbidden_modules = [
    "agentlen.infrastructure",
    "sqlalchemy",
    "fastapi",
    "polars",
    "anthropic",
    "openai",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE", "PLR"]
ignore = ["S101"]   # allow assert in tests

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reflowing machine output on every regeneration is noise.
"alembic/versions/*" = ["E501"]
# Literal expectations are the point of a test, not a magic number to extract.
"tests/*" = ["PLR2004"]
