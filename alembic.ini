# Alembic configuration.
# The database URL is NOT stored here: it comes from the DATABASE_URL
# environment variable, resolved in alembic/env.py (12-factor, and no
# credentials in the repository).

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# Migrations are prefixed with a zero-padded sequence so `ls` sorts them in
# apply order, which a bare hash does not.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
