# Local reproduction stack: `db` (Postgres 16), `api` (FastAPI, migrations run
# before uvicorn starts), `worker` (the C6 import worker, #55) and `frontend`
# (the web interface on http://localhost:8080, #117).
#
# Run via `make up` (from the repo root) rather than a bare `docker compose
# up`, so relative paths below always resolve against the repo root and not
# wherever the shell happens to be:
#   docker compose -f docker/docker-compose.yml --project-directory . up --build

services:
  db:
    image: postgres:16-alpine
    # Read from .env, with the values every existing .env was written against.
    # Postgres applies them only when the volume is first created: changing
    # them afterwards means recreating the volume (`docker compose down -v`,
    # which deletes the data).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentlen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentlen}
      POSTGRES_DB: ${POSTGRES_DB:-agentlen}
    volumes:
      - agentlen_pgdata:/var/lib/postgresql/data
    # Loopback only: the host keeps its access (psql, a host-run test suite),
    # the local network gets none — this database holds session tokens and
    # imported traces. The port is overridable so a host already running
    # Postgres on 5432 does not block the stack; `api`/`worker` only ever reach
    # `db` over the internal compose network, never through this mapping.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      # `$$`: expanded by the container's shell, from the environment above.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env: inside the compose
      # network Postgres is reachable at the service name `db`, never at
      # localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentlen}:${POSTGRES_PASSWORD:-agentlen}@db:5432/${POSTGRES_DB:-agentlen}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - agentlen_storage:/app/storage
    # PostgreSQL healthy -> Alembic migrations -> uvicorn. The API stays up
    # after migrating; a failed migration stops the container instead of
    # serving traffic against a schema it never applied.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn agentlen.interfaces.http.app:create_app --factory --host 0.0.0.0 --port 8000"
    # GET /health/ready already reports "reachable AND migrations applied"
    # (infrastructure/persistence/health.py) — reusing it here, rather than
    # inventing a second readiness signal, is what lets `worker` wait on it
    # below instead of racing the migration step.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/v1/health/ready', headers={'X-API-Key': os.environ.get('API_KEY', '')}), timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentlen}:${POSTGRES_PASSWORD:-agentlen}@db:5432/${POSTGRES_DB:-agentlen}
    depends_on:
      db:
        condition: service_healthy
      # `worker` claims rows from `import_run` on startup; if it starts before
      # Alembic has created that table it crashes outright (the claim query
      # isn't behind a retry). Waiting for `api`'s readiness — which is only
      # healthy once migrations are applied — makes that ordering explicit
      # instead of racing `api`'s migration step.
      api:
        condition: service_healthy
    volumes:
      - agentlen_storage:/app/storage
    command: ["python", "-m", "agentlen.interfaces.cli", "worker"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    # Only what nginx needs — not `env_file: .env`, which would hand the
    # provider API keys to a container that has no use for them.
    environment:
      # Read at start-up, never at build time: nginx adds it to every `/api`
      # call, so neither the image nor the bundle contains it (#149). Taken
      # from the same `.env` as `api`, so the two always match.
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-512}
    depends_on:
      api:
        condition: service_healthy
    # The interface reaches the API through its own origin (nginx proxies
    # `/api` to `api`), so no CORS configuration is involved.
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  agentlen_pgdata:
  agentlen_storage:
